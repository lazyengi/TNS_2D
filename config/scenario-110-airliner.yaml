# Scenario di traiettorie casuali, ripetibile tramite seed.
# Un solo file: qui si scelgono quanti mezzi simulare e, sotto profiles,
# i limiti di ogni classe (aereo di linea, drone, auto).
#
# Lancio, dalla radice del repository, con il Python del venv:
#   .\.venv\Scripts\python.exe .\scripts\run_scenario.py
#   .\.venv\Scripts\python.exe .\scripts\run_scenario.py --config config\scenario.yaml
#
# L'integratore non cambia: è sempre l'uniciclo del simulatore.
# Il sorteggio pesca solo stato iniziale e accelerazioni dentro i limiti.
# Lo stesso seed riproduce le stesse traiettorie.
#
# use_profile_arena: true prende spine_length, max_duration e global_dt
# dall'arena del profilo. Va bene se tutti i mezzi sono della stessa classe.
# Un aereo di linea in un quadrato da 100 m non è fisicamente coerente:
# il raggio di virata non ci sta, e lo script si ferma con un errore esplicito.

seed: 110
shape_library: data/aircraft_shape_library.pkl

simulation:
  use_profile_arena: true
  use_dropouts: false
  use_los: false
  use_oor: true
  verbose: true

vehicles:
  count: 1
  profile: airliner
  # In alternativa, un profilo per mezzo (e use_profile_arena: false se le classi differiscono):
  # profiles: [drone, car]
  t_init_gap: 0.0
  max_attempts: 40

export:
  # CSV letto da MATLAB con readtable. null per non scrivere il file.
  tracks_csv: output/tracks-110-airliner.csv

render:
  # Il video richiede FFmpeg sul PATH. Le traiettorie per MATLAB non ne hanno bisogno.
  enabled: false
  mp4_path: output/scenario.mp4
  fps: 30
  dpi: 80
  figsize: [16, 9]

profiles:
  # Crociera 180–240 m/s. Con a_lat massima 4 m/s² il raggio a 200 m/s è v²/a = 10 km
  # e l'imbardata è a/v = 0.02 rad/s. Un raggio di 10 km in 16 km di lato è un solo arco:
  # l'arena è 100 km di lato, così ci stanno alcune virate.
  airliner:
    shape_idx: 0
    speed_min: 180.0
    speed_max: 240.0
    cruise_speed: 200.0
    long_accel_min: -0.8
    long_accel_max: 0.5
    centr_accel_max: 4.0
    min_turn_radius: 10000.0
    max_yaw_rate: 0.02
    n_waypoints_min: 4
    n_waypoints_max: 7
    min_time_in_arena: 100.0
    allow_reverse: false
    reduce_speed_in_turn: false
    arena:
      spine_length: 50000.0
      max_duration: 180.0
      global_dt: 0.25

  # Multirotore: può rallentare fin quasi a fermarsi, non andare in retromarcia, virate strette.
  drone:
    shape_idx: 16
    speed_min: 1.0
    speed_max: 12.0
    cruise_speed: 8.0
    long_accel_min: -3.0
    long_accel_max: 3.0
    centr_accel_max: 6.0
    min_turn_radius: 4.0
    max_yaw_rate: 1.2
    n_waypoints_min: 12
    n_waypoints_max: 18
    min_time_in_arena: 25.0
    allow_reverse: false
    reduce_speed_in_turn: true
    arena:
      spine_length: 60.0
      max_duration: 40.0
      global_dt: 0.05

  # Auto: può fermarsi, non fare retromarcia, accelerazione laterale da aderenza (~0.4 g).
  car:
    shape_idx: 8
    speed_min: 0.0
    speed_max: 16.0
    cruise_speed: 10.0
    long_accel_min: -4.0
    long_accel_max: 2.5
    centr_accel_max: 4.0
    min_turn_radius: 8.0
    max_yaw_rate: 0.6
    n_waypoints_min: 12
    n_waypoints_max: 18
    min_time_in_arena: 20.0
    allow_reverse: false
    reduce_speed_in_turn: true
    arena:
      spine_length: 120.0
      max_duration: 45.0
      global_dt: 0.05
